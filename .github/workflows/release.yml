name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check the tag matches the workflow version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLIST=$(python -c "import plistlib; print(plistlib.load(open('workflow/info.plist','rb'))['version'])")
          if [ "$TAG" != "$PLIST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workflow/info.plist version $PLIST. Bump the version, commit it, then move the tag."
            exit 1
          fi
          echo "info.plist $PLIST matches tag $GITHUB_REF_NAME"

      - name: Build .alfredworkflow
        run: python scripts/build.py

      - name: Get artifact path
        id: artifact
        run: |
          FILE=$(ls dist/*.alfredworkflow)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $FILE)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
